# VLASH Training Configuration for PI05 with RTC (Real-Time Chunking)
# This config enables training-time action conditioning from the RTC paper,
# which improves real-time inference performance by training the model to
# condition on previously executed action chunks.

# Policy configuration
policy:
  type: pi05
  pretrained_path: /workspace/models/lerobot_pi05_libero_base
  push_to_hub: false
  dtype: bfloat16
  device: cuda
  state_cond: true
  # Enable RTC inference: inject first N steps from previous chunk during denoising
  inference_prefix_mask_steps: 8

# Dataset configuration
dataset:
  repo_id: lerobot/libero_spatial_image
  video_backend: torchcodec
  # To use a local dataset, set root to the local path:
  root: /workspace/datasets/lerobot_libero_spatial

# Training parameters
output_dir: /workspace/outputs/rtc_vlash_a800_spatial
job_name: pi05_rtc_vlash_a800
batch_size: 4
steps: 40000
num_workers: 8
dataloader_prefetch_factor: 2
dataloader_persistent_workers: true
seed: 1000

# Optimizer configuration
# Start from the PI0.5 LIBERO base schedule, but keep the VLASH/RTC beta pair.
# The dataset is relatively small and shared_observation already amplifies the
# number of supervised chunks per optimizer step, so we use the more conservative
# 2.5e-5 peak LR instead of the more aggressive 5e-5.
use_policy_training_preset: false
optimizer:
  type: adamw
  lr: 2.5e-5
  betas: [0.9, 0.95]
  weight_decay: 1.0e-2

# Learning rate scheduler
scheduler:
  type: cosine_decay_with_warmup
  num_warmup_steps: 1300
  peak_lr: 2.5e-5
  decay_lr: 2.5e-6
  num_decay_steps: 40000

# Checkpointing
save_checkpoint: true
save_freq: 5000

# Logging
log_freq: 50
wandb:
  enable: true
  project: rtc_vlash_a800_spatial
  entity: null
  disable_artifact: true

# Maximum temporal delay steps (async offset augmentation)
# Set to N to enable random delays from [0, N]
max_delay_steps: 8

# Enable shared observation optimization
# When true, trains all offsets [0, max_delay_steps] together with shared
# observation embeddings instead of randomly sampling one offset per sample
shared_observation: true

# Deprecated/disabled: training now always maps previous action -> state_dim
# (truncate or tail-zero-pad) to match inference semantics.
use_state_ground_truth: false

# RTC prefix mask: during training, randomly sample prefix steps from
# [0, max_prefix_mask_steps] per batch. The first K steps are forced to
# ground truth and excluded from loss. This trains the model to condition
# on previously executed actions for better real-time inference.
# Recommended: 4-8 (should be <= chunk_size)
# max_prefix_mask_steps: 8  
# the prefix per item in each batch has been forced to equal with the actual delay steps per item
# making this parameter useless

# Gradient accumulation
# For 6x A800: 4 x 6 x 1 = 24 global samples per optimizer step before shared
# observation expands offsets. We raise training steps/scheduler span to keep
# total seen samples close to the original 32@30k recipe.
grad_accum_steps: 1
