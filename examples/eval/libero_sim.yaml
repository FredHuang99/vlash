# VLASH LIBERO Simulation Evaluation Config
# This config is simulation-only and does not require a robot section.

policy:
  # Fill your policy checkpoint path.
  path: /workspace/models/pi0.5_libero_base
  device: cuda
  compile_model: false
  fuse_qkv: true
  fuse_gate_up: true

# LIBERO benchmark settings
task_suite: libero_spatial
num_trials_per_task: 20
resolution: 224
env_render_resolution: 256
# Keep null to use openpi's official suite-specific max step budget.
max_steps: null
warmup_steps: 10
replan_steps: 5
env_seed: 7
debug_alignment: false
local_log_dir: /workspace/outputs/eval_outputs

# Async scheduling controls
async_mode: false
async_threshold: 20
async_wait: 5

# Conditioning mode:
#   none      -> no RTC prefix, no VLASH state replacement
#   rtc       -> RTC prefix only
#   vlash     -> VLASH state replacement only
#   rtc_vlash -> enable both RTC and VLASH
inference_mode: none

# Boundary semantics at inference trigger (k is unexecuted index):
#   RTC prefix window: [k, k + rtc_prefix_k - 1]
#   VLASH state index: k + vlash_delay_k - 1
rtc_prefix_k: 4
vlash_delay_k: 4
